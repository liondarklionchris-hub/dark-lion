<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dark Lion 🦁</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: rgba(20, 20, 40, 0.8);
      padding: 40px;
      border-radius: 15px;
      border: 2px solid #ffcc00;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
    }
    h1 {
      color: #ffcc00;
      font-size: 2.5em;
      margin: 0;
      text-shadow: 0 0 10px #ffcc00;
    }
    .subtitle {
      color: #888;
      font-size: 1.1em;
      margin-top: 10px;
    }
    p {
      color: #ccc;
      line-height: 1.6;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🦁 Dark Lion</h1>
    <p class="subtitle">Mon univers digital commence ici</p>
    <p>Une aventure en programmation web avec Termux</p>
  </div>
</body>
</html>
